# Dead tails still check concrete types, stack height, and label depth.
# RUN: split-file %s %t
# RUN: yaml2obj %t/operand.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=TYPE
# RUN: yaml2obj %t/result.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=TYPE
# RUN: yaml2obj %t/excess.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=EXCESS
# RUN: yaml2obj %t/nested.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=MISSING
# RUN: yaml2obj %t/live-floor.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=MISSING
# RUN: yaml2obj %t/else.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=MISSING
# RUN: yaml2obj %t/depth.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=DEPTH
# RUN: yaml2obj %t/live-unreachable.yaml -o - | not mlir-translate --import-wasm 2>&1 | FileCheck %s --check-prefix=TRAP

# TYPE: error: invalid operand type on stack. expecting 'i32', value on stack is of type 'i64'
# EXCESS: error: excess operands at end of expression
# MISSING: error: stack doesn't contain enough values. trying to get 1 operands in a frame containing only 0 values
# DEPTH: error: invalid branch label depth: 1
# TRAP: error: unknown instruction opcode: 0

#--- operand.yaml
# (func (result i32) i32.const 42 return i64.const 0 i32.add)
--- !WASM
FileHeader: {Version: 0x1}
Sections:
  - Type: TYPE
    Signatures:
      - {Index: 0, ParamTypes: [], ReturnTypes: [I32]}
  - Type: FUNCTION
    FunctionTypes: [0]
  - Type: CODE
    Functions:
      - {Index: 0, Locals: [], Body: 412A0F42006A0B}

